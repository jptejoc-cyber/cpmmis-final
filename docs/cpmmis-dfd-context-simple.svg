<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img" aria-labelledby="dfdTitle dfdDesc">
  <title id="dfdTitle">CPMMIS Simplified Context Diagram — Gane and Sarson notation</title>
  <desc id="dfdDesc">Simplified Level 0 data flow diagram showing the CPMMIS system as process 0 with one inbound and one outbound data flow for each external entity: Research Group, Adviser, Administrator, and Email Service.</desc>

  <defs>
    <filter id="entityShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="4" dy="5" stdDeviation="3.5" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <filter id="processShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1E3A8A" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#334155"/>
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E2E8F0" stroke-width="0.6" opacity="0.45"/>
    </pattern>
    <style>
      .sans { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
      .flow-label { font-size: 11.5px; font-weight: 700; fill: #1E293B; paint-order: stroke; stroke: #FFFFFF; stroke-width: 3.5px; stroke-linejoin: round; }
      .flow-sub { font-size: 10.5px; font-weight: 500; fill: #475569; paint-order: stroke; stroke: #FFFFFF; stroke-width: 3.5px; stroke-linejoin: round; }
      .flow-line { fill: none; stroke: #334155; stroke-width: 2.2; stroke-linecap: round; }
      .entity-name { font-size: 18px; font-weight: 800; fill: #78350F; letter-spacing: 0.2px; }
      .entity-role { font-size: 11px; font-weight: 600; fill: #92400E; }
      .entity-id { font-size: 9px; font-weight: 700; fill: #B45309; letter-spacing: 1.2px; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="1800" height="1050" fill="#FFFFFF"/>
  <rect width="1800" height="1050" fill="url(#grid)"/>
  <rect x="0" y="0" width="1800" height="7" fill="#1D4ED8"/>
  <rect x="0" y="7" width="1800" height="3" fill="#F59E0B"/>
  <rect x="24" y="24" width="1752" height="1002" rx="18" fill="none" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Header -->
  <text x="70" y="74" class="sans" font-size="32" font-weight="800" fill="#0F172A" letter-spacing="-0.6">CPMMIS Context Diagram</text>
  <text x="70" y="104" class="sans" font-size="13.5" font-weight="700" fill="#1D4ED8" letter-spacing="0.4">LEVEL 0 DFD  ·  GANE &amp; SARSON NOTATION</text>
  <text x="70" y="127" class="sans" font-size="12.5" font-weight="500" fill="#64748B">Capstone Project Management &amp; Monitoring Information System</text>

  <!-- Simplified badge -->
  <g>
    <rect x="70" y="143" width="232" height="24" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.2"/>
    <text x="186" y="159" class="sans" font-size="10" font-weight="800" fill="#047857" text-anchor="middle" letter-spacing="1.1">SIMPLIFIED · ONE IN / ONE OUT</text>
  </g>

  <!-- Gane & Sarson legend -->
  <rect x="1355" y="44" width="375" height="212" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
  <text x="1380" y="70" class="sans" font-size="10" font-weight="800" fill="#475569" letter-spacing="1.5">GANE &amp; SARSON KEY</text>
  <line x1="1380" y1="82" x2="1705" y2="82" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Legend row 1: process -->
  <rect x="1380" y="96" width="48" height="26" rx="7" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.6"/>
  <text x="1404" y="113" class="sans" font-size="11" font-weight="800" fill="#1E3A8A" text-anchor="middle">0</text>
  <text x="1444" y="107" class="sans" font-size="11.5" font-weight="700" fill="#1E293B">Process</text>
  <text x="1444" y="121" class="sans" font-size="9" font-weight="500" fill="#64748B">Rounded rectangle with process ID</text>

  <!-- Legend row 2: external entity -->
  <rect x="1380" y="136" width="48" height="26" fill="#FFFBEB" stroke="#B45309" stroke-width="1.6"/>
  <text x="1444" y="147" class="sans" font-size="11.5" font-weight="700" fill="#1E293B">External entity</text>
  <text x="1444" y="161" class="sans" font-size="9" font-weight="500" fill="#64748B">Square with shadow</text>

  <!-- Legend row 3: data flow -->
  <line x1="1380" y1="188" x2="1428" y2="188" class="flow-line" marker-end="url(#arrow)"/>
  <text x="1444" y="192" class="sans" font-size="11.5" font-weight="700" fill="#1E293B">Data flow</text>
  <text x="1444" y="206" class="sans" font-size="9" font-weight="500" fill="#64748B">Labeled arrow · direction of data</text>

  <!-- Legend row 4: data store -->
  <path d="M 1380 218 H 1428 M 1380 242 H 1428 M 1380 218 V 242 M 1395 218 V 242" fill="none" stroke="#475569" stroke-width="1.6"/>
  <text x="1444" y="228" class="sans" font-size="11.5" font-weight="700" fill="#1E293B">Data store</text>
  <text x="1444" y="242" class="sans" font-size="9" font-weight="500" fill="#64748B">Not shown at Level 0</text>

  <!-- External entities -->
  <!-- EE1: Research Group -->
  <rect x="70" y="425" width="300" height="190" fill="#FFFBEB" stroke="#B45309" stroke-width="2.4" filter="url(#entityShadow)"/>
  <text x="88" y="449" class="sans entity-id">EE1</text>
  <text x="220" y="507" class="sans entity-name" text-anchor="middle">RESEARCH GROUP</text>
  <text x="220" y="531" class="sans entity-role" text-anchor="middle">Student / Group Leader</text>

  <!-- EE2: Adviser -->
  <rect x="760" y="90" width="280" height="140" fill="#FFFBEB" stroke="#B45309" stroke-width="2.4" filter="url(#entityShadow)"/>
  <text x="778" y="114" class="sans entity-id">EE2</text>
  <text x="900" y="152" class="sans entity-name" text-anchor="middle">ADVISER</text>
  <text x="900" y="176" class="sans entity-role" text-anchor="middle">Faculty Adviser</text>

  <!-- EE3: Administrator -->
  <rect x="1430" y="425" width="300" height="190" fill="#FFFBEB" stroke="#B45309" stroke-width="2.4" filter="url(#entityShadow)"/>
  <text x="1448" y="449" class="sans entity-id">EE3</text>
  <text x="1580" y="507" class="sans entity-name" text-anchor="middle">ADMINISTRATOR</text>
  <text x="1580" y="531" class="sans entity-role" text-anchor="middle">System Administrator</text>

  <!-- EE4: Email Service -->
  <rect x="740" y="830" width="320" height="140" fill="#FFFBEB" stroke="#B45309" stroke-width="2.4" filter="url(#entityShadow)"/>
  <text x="758" y="854" class="sans entity-id">EE4</text>
  <text x="900" y="887" class="sans entity-name" text-anchor="middle">EMAIL SERVICE</text>
  <text x="900" y="911" class="sans entity-role" text-anchor="middle">Gmail SMTP Relay</text>

  <!-- Process 0 -->
  <rect x="640" y="390" width="520" height="270" rx="30" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="3" filter="url(#processShadow)"/>
  <line x1="640" y1="438" x2="1160" y2="438" stroke="#1D4ED8" stroke-width="1.4" opacity="0.45"/>
  <text x="672" y="423" class="sans" font-size="22" font-weight="800" fill="#1E3A8A">0</text>
  <text x="1128" y="420" class="sans" font-size="10" font-weight="800" fill="#1D4ED8" text-anchor="end" letter-spacing="1.8">CONTEXT PROCESS</text>

  <text x="900" y="521" class="sans" font-size="38" font-weight="800" fill="#0F172A" text-anchor="middle" letter-spacing="-0.5">CPMMIS</text>
  <text x="900" y="558" class="sans" font-size="17.5" font-weight="600" fill="#1E3A8A" text-anchor="middle">Capstone Project Management &amp;</text>
  <text x="900" y="582" class="sans" font-size="17.5" font-weight="600" fill="#1E3A8A" text-anchor="middle">Monitoring Information System</text>
  <line x1="760" y1="604" x2="1040" y2="604" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="900" y="630" class="sans" font-size="10.5" font-weight="500" fill="#475569" text-anchor="middle">Single process representing the complete system</text>

  <!-- Data flows -->
  <!-- Research Group to system -->
  <path d="M 370 475 H 640" class="flow-line" marker-end="url(#arrow)"/>
  <text x="505" y="438" class="sans flow-label" text-anchor="middle">Requests &amp; submissions</text>
  <text x="505" y="455" class="sans flow-sub" text-anchor="middle">Registration · submissions · meetings · chat</text>

  <!-- System to Research Group -->
  <path d="M 640 565 H 370" class="flow-line" marker-end="url(#arrow)"/>
  <text x="505" y="600" class="sans flow-label" text-anchor="middle">Status, tasks &amp; feedback</text>
  <text x="505" y="617" class="sans flow-sub" text-anchor="middle">Letters · meetings · notifications</text>

  <!-- Adviser to system -->
  <path d="M 820 230 V 390" class="flow-line" marker-end="url(#arrow)"/>
  <text x="800" y="280" class="sans flow-label" text-anchor="end">Adviser decisions</text>
  <text x="800" y="297" class="sans flow-sub" text-anchor="end">Accept/decline · tasks · reviews</text>

  <!-- System to Adviser -->
  <path d="M 980 390 V 230" class="flow-line" marker-end="url(#arrow)"/>
  <text x="1000" y="280" class="sans flow-label" text-anchor="start">Advisee data &amp; alerts</text>
  <text x="1000" y="297" class="sans flow-sub" text-anchor="start">Requests · progress · meetings</text>

  <!-- Administrator to system -->
  <path d="M 1430 475 H 1160" class="flow-line" marker-end="url(#arrow)"/>
  <text x="1295" y="438" class="sans flow-label" text-anchor="middle">Administration input</text>
  <text x="1295" y="455" class="sans flow-sub" text-anchor="middle">Accounts · approvals · letters · backup</text>

  <!-- System to Administrator -->
  <path d="M 1160 565 H 1430" class="flow-line" marker-end="url(#arrow)"/>
  <text x="1295" y="600" class="sans flow-label" text-anchor="middle">Oversight &amp; reports</text>
  <text x="1295" y="617" class="sans flow-sub" text-anchor="middle">Alerts · analytics · logs · backups</text>

  <!-- System to Email Service -->
  <path d="M 820 660 V 830" class="flow-line" marker-end="url(#arrow)"/>
  <text x="800" y="735" class="sans flow-label" text-anchor="end">OTP delivery request</text>
  <text x="800" y="752" class="sans flow-sub" text-anchor="end">Recipient email · reset code</text>

  <!-- Email Service to system -->
  <path d="M 980 830 V 660" class="flow-line" marker-end="url(#arrow)"/>
  <text x="1000" y="735" class="sans flow-label" text-anchor="start">SMTP delivery status</text>
  <text x="1000" y="752" class="sans flow-sub" text-anchor="start">Success / failure response</text>

  <!-- Footer -->
  <line x1="70" y1="1006" x2="1730" y2="1006" stroke="#E2E8F0" stroke-width="1"/>
  <text x="70" y="1028" class="sans" font-size="9.5" font-weight="500" fill="#64748B">Simplified Level 0 view — each arrow bundles several logical flows; the detailed diagram and D1–D10 data dictionary remain the authoritative reference.</text>
  <text x="1730" y="1028" class="sans" font-size="9.5" font-weight="700" fill="#94A3B8" text-anchor="end">CPMMIS  ·  GANE &amp; SARSON</text>
</svg>
