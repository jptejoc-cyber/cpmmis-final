<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 700" width="1040" height="700">
  <defs>
    <!-- Sharp crisp arrow markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b" />
    </marker>
    <marker id="arrow-store" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7" />
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="1" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <style>
    .bg { fill: #f8fafc; }
    .card-bg { fill: #ffffff; }
    .title-main { font-family: 'Segoe UI', -apple-system, system-ui, Roboto, sans-serif; font-size: 16px; font-weight: 800; fill: #0f172a; letter-spacing: -0.2px; }
    .title-sub { font-family: 'Segoe UI', -apple-system, system-ui, Roboto, sans-serif; font-size: 11px; font-weight: 500; fill: #64748b; }
    .badge-pill { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1; rx: 4px; }
    .badge-text { font-family: 'Segoe UI', sans-serif; font-size: 10px; font-weight: 700; fill: #0369a1; text-anchor: middle; }

    /* External Entity Styles */
    .entity-box { fill: #ffffff; stroke: #1e293b; stroke-width: 1.8; filter: url(#shadow); }
    .entity-title { font-family: 'Segoe UI', -apple-system, system-ui, Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .entity-type { font-family: 'Segoe UI', -apple-system, system-ui, Roboto, sans-serif; font-size: 9.5px; font-weight: 600; fill: #64748b; text-anchor: middle; letter-spacing: 0.3px; }

    /* Process Bubble Styles */
    .process-box { fill: #ffffff; stroke: #0f172a; stroke-width: 2.2; rx: 12px; ry: 12px; filter: url(#shadow); }
    .process-header-bg { fill: #f1f5f9; rx: 12px; ry: 12px; }
    .process-divider { stroke: #0f172a; stroke-width: 2; }
    .process-num { font-family: 'Segoe UI', -apple-system, system-ui, Roboto, sans-serif; font-size: 15px; font-weight: 800; fill: #0f172a; text-anchor: middle; }
    .process-title { font-family: 'Segoe UI', -apple-system, system-ui, Roboto, sans-serif; font-size: 13.5px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .process-subtext { font-family: 'Segoe UI', -apple-system, system-ui, Roboto, sans-serif; font-size: 10px; font-weight: 500; fill: #475569; text-anchor: middle; }

    /* Gane & Sarson Data Store Styles */
    .store-bg { fill: #ffffff; }
    .store-id-bg { fill: #f1f5f9; stroke: #1e293b; stroke-width: 1.8; }
    .store-border-line { stroke: #1e293b; stroke-width: 1.8; stroke-linecap: square; }
    .store-id { font-family: 'Segoe UI', -apple-system, system-ui, Roboto, sans-serif; font-size: 11.5px; font-weight: 800; fill: #0f172a; text-anchor: middle; }
    .store-name { font-family: 'Segoe UI', -apple-system, system-ui, Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #1e293b; }
    .store-table { font-family: 'Segoe UI', -apple-system, system-ui, Roboto, sans-serif; font-size: 9px; font-weight: 500; fill: #64748b; }

    /* Flow Lines & Labels */
    .flow-line { stroke: #1e293b; stroke-width: 1.5; fill: none; marker-end: url(#arrow); stroke-linejoin: round; stroke-linecap: round; }
    .flow-store { stroke: #0284c7; stroke-width: 1.5; fill: none; marker-end: url(#arrow-store); stroke-linejoin: round; stroke-linecap: round; }
    .flow-bg { fill: #ffffff; opacity: 0.92; }
    .flow-label { font-family: 'Segoe UI', -apple-system, system-ui, Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #0f172a; }
    .flow-id { font-weight: 800; fill: #2563eb; font-size: 9.5px; }
    .flow-label-store { font-family: 'Segoe UI', -apple-system, system-ui, Roboto, sans-serif; font-size: 9.5px; font-weight: 600; fill: #0369a1; }
  </style>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" class="bg" />

  <!-- Outer Frame -->
  <rect x="15" y="15" width="1010" height="670" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />

  <!-- Header Banner -->
  <g transform="translate(35, 42)">
    <rect x="-8" y="-18" width="58" height="22" class="badge-pill" />
    <text x="21" y="-3" class="badge-text">DFD 1.0</text>
    <text x="65" y="-2" class="title-main">Process 1.0 — Account & Access Management</text>
    <text x="65" y="14" class="title-sub">Capstone Project Management &amp; Monitoring Information System (CPMMIS) · Level 1 Decomposition · Gane & Sarson Notation</text>
  </g>  <!-- ==================== PROCESS 1.0 ==================== -->
  <g id="process-1.0">
    <!-- Process Box Outer -->
    <rect x="385" y="290" width="270" height="95" class="process-box" />
    <!-- Top ID Compartment -->
    <line x1="385" y1="320" x2="655" y2="320" class="process-divider" />
    <text x="520" y="310" class="process-num">1.0</text>
    <!-- Bottom Name Compartment -->
    <text x="520" y="343" class="process-title">Account & Access Management</text>
    <text x="520" y="362" class="process-subtext">Subprocesses 1.1 — 1.5</text>
  </g>  <!-- Entity EE3: Administrator -->
  <g id="entity-EE3">
    <rect x="45" y="140" width="175" height="75" class="entity-box" />
    <text x="132.5" y="174" class="entity-title">Administrator</text>
    <text x="132.5" y="192" class="entity-type">External Actor</text>
  </g>  <!-- Entity EE1: Research Group -->
  <g id="entity-EE1">
    <rect x="45" y="430" width="175" height="75" class="entity-box" />
    <text x="132.5" y="464" class="entity-title">Research Group</text>
    <text x="132.5" y="482" class="entity-type">External Actor</text>
  </g>  <!-- Entity EE2: Adviser -->
  <g id="entity-EE2">
    <rect x="820" y="140" width="175" height="75" class="entity-box" />
    <text x="907.5" y="174" class="entity-title">Adviser</text>
    <text x="907.5" y="192" class="entity-type">External Actor</text>
  </g>  <!-- Entity EE4: Email Service -->
  <g id="entity-EE4">
    <rect x="820" y="430" width="175" height="75" class="entity-box" />
    <text x="907.5" y="464" class="entity-title">Email Service</text>
    <text x="907.5" y="482" class="entity-type">Gmail SMTP Relay</text>
  </g>  <!-- Data Store DS1: User Accounts -->
  <g id="store-DS1">
    <rect x="260" y="90" width="220" height="42" class="store-bg" />
    <!-- ID compartment -->
    <rect x="260" y="90" width="46" height="42" class="store-id-bg" />
    <!-- Top & Bottom Open-ended lines -->
    <line x1="306" y1="90" x2="480" y2="90" class="store-border-line" />
    <line x1="306" y1="132" x2="480" y2="132" class="store-border-line" />
    <!-- Labels -->
    <text x="283" y="115" class="store-id">DS1</text>
    <text x="316" y="109" class="store-name">User Accounts</text>
    <text x="316" y="123" class="store-table">group, adviser, admin</text>
  </g>  <!-- Data Store DS10: Login Logs -->
  <g id="store-DS10">
    <rect x="560" y="90" width="210" height="42" class="store-bg" />
    <!-- ID compartment -->
    <rect x="560" y="90" width="46" height="42" class="store-id-bg" />
    <!-- Top & Bottom Open-ended lines -->
    <line x1="606" y1="90" x2="770" y2="90" class="store-border-line" />
    <line x1="606" y1="132" x2="770" y2="132" class="store-border-line" />
    <!-- Labels -->
    <text x="583" y="115" class="store-id">DS10</text>
    <text x="616" y="109" class="store-name">Login Logs</text>
    <text x="616" y="123" class="store-table">login_logs audit</text>
  </g>  <!-- Data Store DS12: Password Reset OTPs -->
  <g id="store-DS12">
    <rect x="260" y="560" width="220" height="42" class="store-bg" />
    <!-- ID compartment -->
    <rect x="260" y="560" width="46" height="42" class="store-id-bg" />
    <!-- Top & Bottom Open-ended lines -->
    <line x1="306" y1="560" x2="480" y2="560" class="store-border-line" />
    <line x1="306" y1="602" x2="480" y2="602" class="store-border-line" />
    <!-- Labels -->
    <text x="283" y="585" class="store-id">DS12</text>
    <text x="316" y="579" class="store-name">Password Reset OTPs</text>
    <text x="316" y="593" class="store-table">password_resets</text>
  </g>  <!-- Data Store DS13: Rate Limits -->
  <g id="store-DS13">
    <rect x="560" y="560" width="210" height="42" class="store-bg" />
    <!-- ID compartment -->
    <rect x="560" y="560" width="46" height="42" class="store-id-bg" />
    <!-- Top & Bottom Open-ended lines -->
    <line x1="606" y1="560" x2="770" y2="560" class="store-border-line" />
    <line x1="606" y1="602" x2="770" y2="602" class="store-border-line" />
    <!-- Labels -->
    <text x="583" y="585" class="store-id">DS13</text>
    <text x="616" y="579" class="store-name">Rate Limits</text>
    <text x="616" y="593" class="store-table">login_rate_limits</text>
  </g>  <path d="M 220,165 L 340,165 L 340,310 L 385,310" class="flow-line" />
  <rect x="225" y="148" width="256" height="16" class="flow-bg" rx="2" />
  <text x="228" y="160" class="flow-label" text-anchor="start"><tspan class="flow-id">F5: </tspan>Approve/Decline Group, Reset Password</text>  <path d="M 385,330 L 310,330 L 310,195 L 220,195" class="flow-line" />
  <rect x="225" y="197" width="274" height="16" class="flow-bg" rx="2" />
  <text x="228" y="209" class="flow-label" text-anchor="start"><tspan class="flow-id">F6: </tspan>Pending Group Alert, Action Confirmation</text>  <path d="M 220,450 L 330,450 L 330,355 L 385,355" class="flow-line" />
  <rect x="225" y="432" width="256" height="16" class="flow-bg" rx="2" />
  <text x="228" y="444" class="flow-label" text-anchor="start"><tspan class="flow-id">F1: </tspan>Registration Data, Login, OTP Request</text>  <path d="M 385,375 L 310,375 L 310,480 L 220,480" class="flow-line" />
  <rect x="225" y="483" width="262" height="16" class="flow-bg" rx="2" />
  <text x="228" y="495" class="flow-label" text-anchor="start"><tspan class="flow-id">F2: </tspan>Pending Status, Auth Token, Reset Link</text>  <path d="M 820,165 L 700,165 L 700,310 L 655,310" class="flow-line" />
  <rect x="532" y="148" width="280" height="16" class="flow-bg" rx="2" />
  <text x="812" y="160" class="flow-label" text-anchor="end"><tspan class="flow-id">F3: </tspan>Adviser Credentials, OTP, Password Update</text>  <path d="M 655,330 L 730,330 L 730,195 L 820,195" class="flow-line" />
  <rect x="538" y="197" width="274" height="16" class="flow-bg" rx="2" />
  <text x="812" y="209" class="flow-label" text-anchor="end"><tspan class="flow-id">F4: </tspan>Auth Confirmation, Password Reset Status</text>  <path d="M 655,355 L 730,355 L 730,450 L 820,450" class="flow-line" />
  <rect x="574" y="432" width="238" height="16" class="flow-bg" rx="2" />
  <text x="812" y="444" class="flow-label" text-anchor="end"><tspan class="flow-id">F7: </tspan>Recipient Email & 6-Digit OTP Code</text>  <path d="M 820,480 L 700,480 L 700,375 L 655,375" class="flow-line" />
  <rect x="568" y="483" width="244" height="16" class="flow-bg" rx="2" />
  <text x="812" y="495" class="flow-label" text-anchor="end"><tspan class="flow-id">F8: </tspan>SMTP Delivery Result (Success/Fail)</text>  <path d="M 370,132 L 370,290" class="flow-store" />
  <rect x="237" y="228" width="172" height="16" class="flow-bg" rx="2" />
  <text x="240" y="240" class="flow-label-store" text-anchor="start">Account Query & Credentials</text>  <path d="M 420,290 L 420,132" class="flow-store" />
  <rect x="422" y="228" width="184" height="16" class="flow-bg" rx="2" />
  <text x="425" y="240" class="flow-label-store" text-anchor="start">Store Account / Hash / Status</text>  <path d="M 610,290 L 610,132" class="flow-store" />
  <rect x="612" y="228" width="226" height="16" class="flow-bg" rx="2" />
  <text x="615" y="240" class="flow-label-store" text-anchor="start">Record Login Audit (IP, Agent, Time)</text>  <path d="M 420,385 L 420,560" class="flow-store" />
  <rect x="262" y="463" width="178" height="16" class="flow-bg" rx="2" />
  <text x="265" y="475" class="flow-label-store" text-anchor="start">Store / Burn OTP bcrypt Hash</text>  <path d="M 610,385 L 610,560" class="flow-store" />
  <rect x="612" y="463" width="232" height="16" class="flow-bg" rx="2" />
  <text x="615" y="475" class="flow-label-store" text-anchor="start">Check & Increment Rate Limit Counters</text></svg>
