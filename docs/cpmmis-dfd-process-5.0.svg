    <text x="520" y="310" class="process-num">5.0</text>
    <!-- Bottom Name Compartment -->
    <text x="520" y="343" class="process-title">Communication & Notifications</text>
    <text x="520" y="362" class="process-subtext">Subprocesses 5.1 — 5.5</text>
  </g>  <!-- Entity EE1: Research Group -->
  <g id="entity-EE1">
    <rect x="45" y="290" width="175" height="75" class="entity-box" />
    <text x="132.5" y="324" class="entity-title">Research Group</text>
    <text x="132.5" y="342" class="entity-type">External Actor</text>
  </g>  <!-- Entity EE3: Administrator -->
  <g id="entity-EE3">
    <rect x="820" y="140" width="175" height="75" class="entity-box" />
    <text x="907.5" y="174" class="entity-title">Administrator</text>
    <text x="907.5" y="192" class="entity-type">External Actor</text>
  </g>  <!-- Entity EE2: Adviser -->
  <g id="entity-EE2">
    <rect x="820" y="440" width="175" height="75" class="entity-box" />
    <text x="907.5" y="474" class="entity-title">Adviser</text>
    <text x="907.5" y="492" class="entity-type">External Actor</text>
  </g>  <!-- Data Store DS6: Chat Messages -->
